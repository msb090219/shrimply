name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: unshrimp-win64.zip
          # Attach the separately verified Mac package to the draft before publishing.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: python fetch_models.py
      - name: verify tag and dependency versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip check
          python -c 'import importlib.metadata as m, os; tag = os.environ["RELEASE_TAG"]; version = "v" + m.version("unshrimp"); assert tag == version, f"Tag {tag} does not match {version}"'
      - run: python -m pytest -q

      - name: build with PyInstaller
        run: python -m PyInstaller unshrimp.spec --noconfirm --clean

      - name: smoke test Windows executable
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'unshrimp-smoke.json'
          $exePath = Join-Path $PWD 'dist/unshrimp/unshrimp.exe'
          $process = Start-Process -FilePath $exePath -ArgumentList @('--smoke-test', "`"$reportPath`"") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed: $($process.ExitCode)" }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.frozen) { throw 'Packaged resources or inference check failed' }
          Get-Content -LiteralPath $reportPath

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/unshrimp -DestinationPath dist/${{ matrix.asset }}

      - name: package (macos)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry ${{ matrix.asset }} Unshrimp.app

      - name: attach to draft release
        shell: bash  # backslash continuations + `|| true` are bash syntax
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" --draft \
            --title "${{ github.ref_name }}" \
            --notes "Auto-built artifacts. Fill in the notes, then publish." || true
          gh release upload "${{ github.ref_name }}" dist/${{ matrix.asset }} --clobber
