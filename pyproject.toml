[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shrimply"
version = "1.3.0"
description = "Shrimply — don't get shrimped. A local, private posture guard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "msb090219" }]
dependencies = [
    "mediapipe==1.1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "mediapipe==0.10.21; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python==5.0.0.93; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-contrib-python==4.11.0.86; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "PySide6==6.12.0; sys_platform != 'darwin'",
    "PySide6==6.10.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=11; sys_platform == 'darwin'",
    "numpy>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/msb090219/shrimply"

[tool.setuptools.packages.find]
include = ["shrimply*"]
